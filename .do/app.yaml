name: aif-onlinetools
region: nyc  # Change to your preferred region: nyc, sfo, ams, sgp, lon, fra, tor, blr, syd

services:
  # ===================
  # Next.js Frontend
  # ===================
  - name: frontend
    github:
      repo: AIF-development-team/aif-onlinetools
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: Dockerfile.frontend
    http_port: 3000
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    routes:
      - path: /
    envs:
      - key: NEXT_PUBLIC_API_URL
        value: /api
        scope: BUILD_TIME

  # ===================
  # Python FastAPI Backend
  # ===================
  - name: backend
    github:
      repo: AIF-development-team/aif-onlinetools
      branch: main
      deploy_on_push: true
    source_dir: /api
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    routes:
      - path: /api
        preserve_path_prefix: true
